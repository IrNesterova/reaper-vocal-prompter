name: tests

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run tests
        run: lua5.4 tests/run_tests.lua
      - name: Check for accidental globals
        run: |
          npm install --no-save luaparse@0.3.1
          node tests/tools/check_globals.js Vocal_Prompter.lua
